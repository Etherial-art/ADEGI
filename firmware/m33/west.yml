# West manifest for the ADEGI M33 firmware (see README.md for how to init).
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # TODO(verify): pick the Zephyr release that ships the stm32mp257f_dk M33 board.
      revision: v4.2.0
      import:
        name-allowlist:
          - cmsis
          - hal_stm32
          - libmetal
          - open-amp
